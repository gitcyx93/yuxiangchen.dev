<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Chen Yuxiang</title>
  <meta name="description" content="{{summary}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{summary}}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="top">
    <a href="{{homeHref}}">yuxiangchen.dev</a>
    <a href="{{homeHref}}#garden">{{back}}</a>
  </nav>

  <article>
    <header class="note-head">
      <div>
        <h1>{{title}}</h1>
        <p class="note-meta">{{meta}}</p>
      </div>
      <!-- 这条笔记在花园里的那株植物 -->
      <svg class="note-plant" viewBox="-40 -124 80 130" aria-hidden="true">
        <path class="ground" d="M-36 0H36"/>
        <g class="sway">{{plant}}</g>
      </svg>
    </header>
    <div class="prose body">{{body}}</div>
  </article>

  <footer>© {{year}} Chen Yuxiang</footer>
</main>
</body>
</html>
