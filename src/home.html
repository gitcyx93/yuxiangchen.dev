<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{name}}">
  <meta property="og:description" content="{{description}}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="top">
    <a href="{{homeHref}}">yuxiangchen.dev</a>
    <a href="{{otherHref}}" lang="{{otherLangCode}}">{{otherLang}}</a>
  </nav>

  <header>
    <h1>{{name}}</h1>
    <p class="lede">{{lede}}</p>
  </header>

  <!-- 花园：植物在构建时就画好了，没有 JavaScript 也能看、能点 -->
  <section class="garden" id="garden">
    <h2>{{gardenTitle}}</h2>
    <div class="rows">{{garden}}</div>
    <p class="caption" id="caption" data-default="{{caption}}" aria-live="polite">{{caption}}</p>
    <p class="quiet">{{gardenHelp}}</p>
  </section>

  <section>
    <h2>{{notesTitle}}</h2>
    {{notes}}
  </section>

  <section>
    <h2>{{aboutTitle}}</h2>
    <div class="prose">{{about}}</div>
  </section>

  <section>
    <h2>{{contactTitle}}</h2>
    <dl class="links">
      <div><dt>Email</dt><dd><a href="mailto:chen@yuxiangchen.dev">chen@yuxiangchen.dev</a></dd></div>
      <div><dt>GitHub</dt><dd><a href="https://github.com/gitcyx93">gitcyx93</a></dd></div>
    </dl>
    <p class="quiet">{{contactNote}}</p>
  </section>

  <footer>© {{year}} Chen Yuxiang</footer>
</main>
<script src="/garden.js" defer></script>
</body>
</html>
